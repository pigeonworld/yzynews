<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YZY News</title>
    <script>
        // If path doesn't start with /yzynews/, redirect to /yzynews/ + path
        const path = window.location.pathname;
        if (!path.startsWith('/yzynews/')) {
            const newPath = '/yzynews' + path;
            sessionStorage.redirect = newPath;
            window.location.href = '/yzynews/';
        } else {
            sessionStorage.redirect = path;
            window.location.href = '/yzynews/';
        }
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
